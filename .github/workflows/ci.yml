name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "pytest / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra pyside6

      - name: Run tests
        run: uv run pytest --tb=short

  package-windows:
    name: "package / Windows portable"
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_BACKEND: pyside6

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install packaging dependencies
        run: uv sync --frozen --extra pyside6 --extra package

      - name: Fetch bundled OptiX denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\fetch_optix_denoiser.ps1

      - name: Build bundled OIDN denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\build_oidn_denoiser.ps1

      - name: Validate OIDN UINT channel preservation
        shell: pwsh
        run: |
          $denoiser = Get-ChildItem -LiteralPath ".\h_denoise_utils\vendor\oidn-denoiser\windows-x64" -Filter "Denoiser.exe" -Recurse | Select-Object -First 1
          if (-not $denoiser) { throw "Could not find bundled OIDN Denoiser.exe" }
          uv run --native-tls --with OpenEXR --with numpy python .\tools\validate_oidn_uint_preservation.py --denoiser $denoiser.FullName

      - name: Build portable package
        shell: pwsh
        run: .\tools\build_windows_package.ps1 -Variant bundled

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: h-denoise-bundled-windows-x64
          path: dist/h-denoise-bundled-windows-x64-v*.zip
          if-no-files-found: error
