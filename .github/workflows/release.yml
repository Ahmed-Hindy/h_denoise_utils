name: Release Bundled Runtime

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-windows:
    name: "release / Windows bundled runtime"
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_BACKEND: pyside6
      OIDN_VERSION: "2.5.0"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: oidn-conan-${{ runner.os }}-${{ env.OIDN_VERSION }}-${{ hashFiles('native/oidn-denoiser/conanfile.txt') }}
          restore-keys: |
            oidn-conan-${{ runner.os }}-${{ env.OIDN_VERSION }}-
            oidn-conan-${{ runner.os }}-

      - name: Cache OIDN SDK package
        uses: actions/cache@v4
        with:
          path: h_denoise_utils/vendor/oidn/windows-x64/oidn-${{ env.OIDN_VERSION }}
          key: oidn-sdk-${{ runner.os }}-${{ env.OIDN_VERSION }}

      - name: Verify tag version
        shell: pwsh
        run: |
          $packageVersion = (Select-String -Path "pyproject.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }

      - name: Fetch bundled OptiX denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\fetch_optix_denoiser.ps1

      - name: Fetch or build bundled OIDN denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            .\tools\fetch_oidn_denoiser.ps1 -Version $env:OIDN_VERSION -CopyAssetToDist
          }
          catch {
            Write-Warning "Could not fetch a matching prebuilt OIDN denoiser: $($_.Exception.Message)"
            .\tools\build_oidn_denoiser.ps1 -Version $env:OIDN_VERSION
          }

      - name: Validate OIDN UINT channel preservation
        shell: pwsh
        run: |
          $denoiser = ".\h_denoise_utils\vendor\oidn-denoiser\windows-x64\oidn-$env:OIDN_VERSION\Denoiser.exe"
          if (-not (Test-Path -LiteralPath $denoiser)) {
            throw "Could not find bundled OIDN Denoiser.exe: $denoiser"
          }
          uv run --system-certs --with OpenEXR --with numpy python `
            .\tools\validate_oidn_uint_preservation.py `
            --denoiser $denoiser

      - name: Install packaging dependencies
        run: uv sync --frozen --extra pyside6 --extra package-nuitka

      - name: Build Nuitka bundled package
        shell: pwsh
        run: .\tools\build_windows_nuitka_package.ps1 -IncludeBundledRuntimes -ReleasePackage

      - name: Validate packaged OIDN denoise
        shell: pwsh
        run: |
          uv run --system-certs --with OpenEXR --with numpy python `
            .\tools\validate_packaged_oidn_denoise.py `
            --app .\dist\h-denoise\h-denoise.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $meta = & ".\tools\github_release_metadata.ps1" -Tag $tag
          $appAsset = Get-ChildItem -Path "dist" -Filter "h-denoise-bundled-windows-x64-v*.zip" | Select-Object -First 1
          if (-not $appAsset) {
            throw "Bundled app package zip not found"
          }
          $notes = $meta.Notes.Trim()

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title $meta.Title --notes $notes
          }
          else {
            gh release edit $tag --repo $repo --title $meta.Title --notes $notes
          }
          gh release upload $tag $appAsset.FullName --repo $repo --clobber
