name: Release Bundled Runtime

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    name: "release / Windows bundled runtime"
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_BACKEND: pyside6

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag version
        shell: pwsh
        run: |
          $packageVersion = (Select-String -Path "pyproject.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }

      - name: Fetch bundled OptiX denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\fetch_optix_denoiser.ps1

      - name: Build bundled OIDN denoiser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\build_oidn_denoiser.ps1

      - name: Validate OIDN UINT channel preservation
        shell: pwsh
        run: |
          $denoiser = Get-ChildItem -LiteralPath ".\h_denoise_utils\vendor\oidn-denoiser\windows-x64" -Filter "Denoiser.exe" -Recurse | Select-Object -First 1
          if (-not $denoiser) { throw "Could not find bundled OIDN Denoiser.exe" }
          uv run --native-tls --with OpenEXR --with numpy python .\tools\validate_oidn_uint_preservation.py --denoiser $denoiser.FullName

      - name: Install packaging dependencies
        run: uv sync --frozen --extra pyside6 --extra package

      - name: Build bundled package
        shell: pwsh
        run: .\tools\build_windows_package.ps1 -Variant bundled

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $meta = & ".\tools\github_release_metadata.ps1" -Tag $tag
          $appAsset = Get-ChildItem -Path "dist" -Filter "h-denoise-bundled-windows-x64-v*.zip" | Select-Object -First 1
          $oidnAsset = Get-ChildItem -Path "dist" -Filter "oidn-denoiser-windows-x64-oidn-*.zip" | Select-Object -First 1
          if (-not $appAsset) {
            throw "Bundled app package zip not found"
          }
          if (-not $oidnAsset) {
            throw "OIDN denoiser bundle zip not found"
          }

          $appSha = (& git rev-parse HEAD).Trim()
          $denoiserRelease = "optix-denoiser-v2026.05.18"
          $denoiserSha = "fc927b7eaa5f0c949226f3d23e302ebb0f4e33cf"
          $optix81Sha = "50021ea0af6d41609a97777ceebbdf1e1d34efe7"
          $optix90Sha = "fff65c2a7c592f1ea5f1661ad7d2381cf965f9bd"
          $optix91Sha = "f1f6dd803f3159992d248178f6e09421c6eb8b6d"
          $oidnVersion = "2.4.1"
          $variantNotes = @"

          ## Windows Package

          | Package | Artifact | Behavior |
          | --- | --- | --- |
          | Bundled runtime | ``$($appAsset.Name)`` | Houdini-free app bundling OptiX 8.1, 9.0, 9.1, and the custom OIDN $oidnVersion multipart EXR denoiser. Users choose OptiX or OIDN in the UI. |
          | OIDN wrapper bundle | ``$($oidnAsset.Name)`` | Raw custom OIDN ``Denoiser.exe`` runtime bundle for package fetch workflows and smoke validation. |

          ## Build SHAs

          - Bundled app: ``$appSha``
          - Bundled OptiX denoiser release: ``$denoiserRelease``
          - Bundled OptiX denoiser source: ``$denoiserSha``
          - OptiX 8.1 SDK commit: ``$optix81Sha``
          - OptiX 9.0 SDK commit: ``$optix90Sha``
          - OptiX 9.1 SDK commit: ``$optix91Sha``
          - Intel OIDN version: ``$oidnVersion``

          Note: OptiX and OIDN are different denoisers. Output differences are expected and should not be treated as quality superiority without ground truth or visual review.
          "@
          $notes = ($meta.Notes.Trim() + "`n" + $variantNotes.Trim()).Trim()

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title $meta.Title --notes $notes
          }
          else {
            gh release edit $tag --repo $repo --title $meta.Title --notes $notes
          }
          gh release upload $tag $appAsset.FullName $oidnAsset.FullName --repo $repo --clobber
