[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h_denoise_utils"
version = "2.0.0"
description = "Standalone GUI for bundled OptiX and OIDN multipart EXR denoising"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14,!=3.12.*"
dependencies = []   # Qt is detected at runtime — no hard dependency

[project.optional-dependencies]
pyside6 = ["PySide6-Essentials>=6.8.1"]
pyqt6 = ["PyQt6>=6.8.1"]
dev = ["pytest>=7", "pytest-qt", "hypothesis>=6.79.4", "ruff"]
package = ["pyinstaller>=6.13,<7"]

[project.scripts]
h-denoise = "h_denoise_utils.__main__:main"

[project.urls]
Repository = "https://github.com/Ahmed-Hindy/h_denoise_utils"

[tool.hatch.build.targets.wheel]
packages = ["h_denoise_utils"]

[tool.hatch.build.targets.wheel.force-include]
"h_denoise_utils/ui/style.qss" = "h_denoise_utils/ui/style.qss"
"h_denoise_utils/ui/icons" = "h_denoise_utils/ui/icons"

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]

[dependency-groups]
dev = [
    "hypothesis>=6.79.4",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["N802", "N806", "N816"]
